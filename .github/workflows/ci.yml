name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    CI: 'true'
    LC_ALL: en_US.UTF-8
    LANG: en_US.UTF-8
    SLANGC: /tmp/slang/bin/slangc

jobs:
    test:
        name: Unit tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-26-intel]
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.14'

            - uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: go.mod

            - name: Build
              run: python3 .github/workflows/ci.py build

            - name: Run Python and Go unit tests
              run: ./test.py
