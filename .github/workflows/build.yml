name: Build

on:
    push:
        tags: ['v*']
    schedule:
        - cron: '0 18 * * *' # 02:00 China Standard Time
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: false

env:
    CI: 'true'
    LC_ALL: en_US.UTF-8
    LANG: en_US.UTF-8
    SLANGC: /tmp/slang/bin/slangc

jobs:
    macos:
        name: macOS universal DMG
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        runs-on: macos-26-intel
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0 # Required by the documentation's commit links
                  persist-credentials: false

            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.14'

            - uses: actions/setup-go@v7.1.0
              with:
                  go-version-file: go.mod

            - name: Install documentation and packaging tools
              run: python3 -m pip install -r docs/requirements.txt certifi meson ninja

            - name: Build documentation prerequisites
              run: python3 .github/workflows/ci.py build

            - name: Build documentation
              run: make FAIL_WARN=1 docs

            - name: Prepare bypy dependencies
              run: make macos-app-deps BYPY_PYTHON="$(command -v python3)"

            - name: Build and test unsigned DMG
              run: make macos-app BYPY_PYTHON="$(command -v python3)" MACOS_SIGN=0 MACOS_NOTARIZE=0

            - uses: actions/upload-artifact@v7
              with:
                  name: macos-universal
                  path: /Users/Shared/kitty-build/sw/dist/*.dmg
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Publish release
        needs: macos
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            BUILD_REF: ${{ github.ref }}
            BUILD_TAG: ${{ github.ref_name }}
            BUILD_SHA: ${{ github.sha }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: macos-universal
                  path: dist

            - name: Publish tag release or nightly
              shell: bash
              run: |
                  if [[ "$BUILD_REF" == refs/tags/v* ]]; then
                      if ! gh release view "$BUILD_TAG" >/dev/null 2>&1; then
                          gh release create "$BUILD_TAG" --verify-tag --title "$BUILD_TAG" --generate-notes \
                              --notes 'Unsigned macOS universal build; not notarized by Apple.'
                      fi
                      gh release upload "$BUILD_TAG" dist/*.dmg --clobber
                  else
                      notes="Unsigned macOS universal build from commit $BUILD_SHA."
                      if gh release view nightly >/dev/null 2>&1; then
                          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
                              -f sha="$BUILD_SHA" -F force=true
                          gh release edit nightly --title Nightly --notes "$notes" --prerelease --latest=false
                      else
                          gh release create nightly --target "$BUILD_SHA" --title Nightly \
                              --notes "$notes" --prerelease --latest=false
                      fi
                      gh release upload nightly dist/*.dmg --clobber
                      # Keep only the current DMG when the application version changes.
                      gh release view nightly --json assets --jq '.assets[].name' |
                          while IFS= read -r asset; do
                              if [[ "$asset" == *.dmg && ! -f "dist/$asset" ]]; then
                                  gh release delete-asset nightly "$asset" --yes
                              fi
                          done
                  fi
